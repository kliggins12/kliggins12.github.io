name: Apply Batchmate Board Replay Schema

on:
  workflow_dispatch:

concurrency:
  group: batchmate-d1-schema
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler dependencies
        working-directory: cloudflare
        run: npm install

      - name: Apply only the new board replay schema
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          workingDirectory: cloudflare
          command: d1 execute batchmate --remote --file=migrations/0003_board_replay.sql
