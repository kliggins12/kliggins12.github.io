name: Seed Backup D1 from Main

on:
  workflow_dispatch:
    inputs:
      max_draw_rows:
        description: "Maximum drawing rows to copy in this run (keep below the daily 80% safety guard)"
        required: true
        type: number
        default: 60000

permissions:
  contents: read

concurrency:
  group: seed-backup-d1
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Copy Main D1 data into Backup D1
        env:
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          CLOUDFLARE_BACKUP_D1_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_D1_TOKEN }}
          MAX_DRAW_ROWS: ${{ inputs.max_draw_rows }}
          PRIMARY_ACCOUNT_ID: 41745143f8e073c6d617c36b04d1b5cd
          PRIMARY_D1_ID: 1180909a-5bac-4747-87ce-e3293fe61163
          BACKUP_ACCOUNT_ID: 837536310e0248f357e04b157577494b
          BACKUP_D1_ID: 3482ac37-d463-4efc-b6cc-b77dd6f35dd2
        run: node cloudflare/scripts/seed-backup-d1.mjs
