name: refresh-data

on:
  schedule:
    - cron: '30 4,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Checkout Batchmate data pipeline
        uses: actions/checkout@v4
        with:
          repository: kliggins12/batchmate
          ref: master
          path: batchmate-src

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install numpy

      - name: Restore cached lotto combo arrays
        id: lotto-cache
        uses: actions/cache@v4
        with:
          path: batchmate-src/pipeline/_archive
          key: lotto-combos-v1

      - name: Generate lotto combo arrays (first run only)
        if: steps.lotto-cache.outputs.cache-hit != 'true'
        working-directory: batchmate-src/pipeline/_archive
        run: |
          python gen_lotto_combos.py
          rm -f lotto_combos.txt

      - name: Fetch latest official draw CSVs
        working-directory: batchmate-src/pipeline
        run: python fetch_all.py

      - name: AoN align
        working-directory: batchmate-src/pipeline
        run: python batchmate_align.py --auto

      - name: AoN rolling tickets
        working-directory: batchmate-src/pipeline
        run: python batchmate_rolling.py 4

      - name: Rolling games
        working-directory: batchmate-src/pipeline
        run: python batchmate_rolling_games.py 4

      - name: Powerball / Mega Millions
        working-directory: batchmate-src/pipeline
        run: python batchmate_powerball_mm.py 4

      - name: Build app data
        working-directory: batchmate-src/pipeline
        run: python batchmate_build.py

      - name: Build tight tickets
        working-directory: batchmate-src/pipeline
        run: python batchmate_tight.py

      - name: Publish app data and 17 source CSVs
        run: |
          cp batchmate-src/pipeline/batchmate_data.json batchmate_data.json
          cp batchmate-src/pipeline/tight_tickets.json tight_tickets.json
          mkdir -p slotterhouse-data
          cp batchmate-src/pipeline/data/*.csv slotterhouse-data/
          python - <<'PY'
          import json, glob, os
          files = sorted(os.path.basename(p) for p in glob.glob('slotterhouse-data/*.csv'))
          expected = 17
          if len(files) != expected:
              raise SystemExit(f'Expected {expected} source CSV files, found {len(files)}')
          with open('slotterhouse-data/manifest.json', 'w') as f:
              json.dump({
                  'generated_utc': __import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat(),
                  'count': len(files),
                  'files': files
              }, f, indent=2)
          print(f'Published {len(files)} source CSV files')
          PY

      - name: Commit refreshed site data
        run: |
          git config user.name "kliggins12"
          git config user.email "kliggins12@users.noreply.github.com"
          git add batchmate_data.json tight_tickets.json slotterhouse-data
          git diff --cached --quiet && echo "No data changes" && exit 0
          git commit -m "Refresh Batchmate and Slotterhouse data $(date -u +%Y-%m-%d)"
          git push
