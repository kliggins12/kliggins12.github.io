name: Deploy Batchmate Cloudflare Worker

on:
  push:
    branches:
      - master
    paths:
      - 'cloudflare/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker dependencies
        working-directory: cloudflare
        run: npm install

      - name: Syntax-check Backup D1 seeding script
        working-directory: cloudflare
        run: node --check scripts/seed-backup-d1.mjs

      - name: Type-check Worker
        working-directory: cloudflare
        run: npm run typecheck

      - name: Run Pick 3 replay regression tests
        working-directory: cloudflare
        run: npm test

      - name: Configure Turso runtime secrets as one Worker version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 41745143f8e073c6d617c36b04d1b5cd
        run: |
          set -euo pipefail
          test -n "$TURSO_DATABASE_URL" || { echo "Missing GitHub secret TURSO_DATABASE_URL"; exit 1; }
          test -n "$TURSO_AUTH_TOKEN" || { echo "Missing GitHub secret TURSO_AUTH_TOKEN"; exit 1; }
          payload="$(node -e 'process.stdout.write(JSON.stringify({secrets:{TURSO_DATABASE_URL:{name:"TURSO_DATABASE_URL",type:"secret_text",text:process.env.TURSO_DATABASE_URL},TURSO_AUTH_TOKEN:{name:"TURSO_AUTH_TOKEN",type:"secret_text",text:process.env.TURSO_AUTH_TOKEN}}}))')"
          response="$(curl --silent --show-error --fail-with-body \
            -X PATCH "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/batchmate-data/secrets-bulk" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/merge-patch+json" \
            --data "$payload")"
          echo "$response" | jq -e '.success == true' >/dev/null

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: cloudflare
          command: deploy
