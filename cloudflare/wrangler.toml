name = "batchmate-data"
main = "src/index.ts"
compatibility_date = "2026-11-19"
workers_dev = true
account_id = "41745143f8e073c6d617c36b04d1b5cd"

[triggers]
crons = ["*/30 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "batchmate"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ARCHIVE"
bucket_name = "batchmate-source-archive"

[observability]
enabled = true
