name = "batchmate-data"
main = "src/index.ts"
compatibility_date = "2026-11-19"
workers_dev = true
account_id = "41745143f8e073c6d617c36b04d1b5cd"

[vars]
INGEST_PAUSED = "true"
DATA_MODE = "turso-primary"

[triggers]
crons = []

[[d1_databases]]
binding = "DB"
database_name = "batchmate"
database_id = "1180909a-5bac-4747-87ce-e3293fe61163"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ARCHIVE"
bucket_name = "batchmate-source-archive"

[observability]
enabled = true
